[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retailmind"
version = "0.1.0"
description = "Incremental applied machine learning and deep learning project"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]